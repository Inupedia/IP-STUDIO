[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ip-studio-api"
version = "0.1.0"
description = "IP Studio V1 API"
requires-python = ">=3.12,<3.16"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "pillow>=11,<14",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["app"]
