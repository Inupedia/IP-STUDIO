services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ip_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ip_studio_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-ip_studio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ip_studio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ip_studio} -d ${POSTGRES_DB:-ip_studio}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ip_studio_postgres:
